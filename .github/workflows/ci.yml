
name: ML Project Continuous Integration

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
test:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: &quot;3.12&quot;

- name: Install dependencies
run: |
python -m pip install --upgrade pip
pip install -r requirements.txt

- name: Train ML model

run: python train.py

- name: Run automated tests
run: python -m pytest -v
Page 1 of 15Experiment: Implementing Continuous Integration with GitHub Actions for an MLProjectIn this experiment, we will create a simple Machine Learning project using Python andScikit-learn, push it to GitHub, and configure GitHub Actions to automatically test the MLcode whenever we push changes to the repository.The procedure is suitable for beginners using Visual Studio Code on Windows.1. AimTo implement a Continuous Integration (CI) pipeline using GitHub Actions to automatetesting of a Machine Learning project and demonstrate how CI can be extended to modeldeployment.2. What will we implement?Step 1: Write ML code in VS CodeTrain a Random Forest classifierStep 2: Push code to GitHubCommit and push changesStep 3: GitHub Actions starts automaticallyInstall dependencies and run testsTests pass - Green check markTests fail - Error details shownImportant distinction: Continuous Integration automatically builds and tests the code.Continuous Deployment adds a step that releases the tested application or model to adeployment environment. We will first implement CI and then discuss how to extend it todeployment.3. Software requirements Python 3.10 or later Visual Studio Code Git A GitHub account Python libraries: scikit-learn, joblib, and pytest4. Create the project folderOpen Visual Studio Code.1. Create a folder named ml-github-actions.2. Open the folder in VS Code.
Page 2 of 153. Select Terminal → New Terminal.4. Execute the following commands in the terminal.python --versiongit --versionpython -m venv .venv.venv\Scripts\Activate.ps1python -m pip install --upgrade pippip install scikit-learn joblib pytestIf PowerShell blocks virtual environment activation, use Command Prompt in VS Code andrun:.venv\Scripts\activate.batCreate the following project structure:ml-github-actions/train.pytest_model.pyrequirements.txt.github/workflows/ci.yml.gitignore5. Create requirements.txtCreate a new file named requirements.txt and add:scikit-learnjoblibpytestThis file tells GitHub Actions which Python packages must be installed before running theproject.
