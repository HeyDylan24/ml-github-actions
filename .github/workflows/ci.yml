Page 8 of 15run: python train.py- name: Run automated testsrun: python -m pytest -vExplanation of the workflowYAML instruction Purposename Names the workflowon: push Starts the workflow when code is pushed to mainpull_request Runs checks when a pull request targets mainruns-on: ubuntu-latest Uses a GitHub-hosted Ubuntu runneractions/checkout Downloads your repository into the runneractions/setup-python Installs the specified Python versionpip install Installs the project dependenciespython train.py Runs the ML training programpython -m pytest -v Executes the automated testsHow CI works: Whenever you push a change to the main branch, GitHub Actions starts afresh environment, installs Python dependencies, runs the training program, and executes thetests. If any command fails, the workflow is marked as failed.10. Create .gitignoreCreate a file named .gitignore in the project root..venv/__pycache__/.pytest_cache/*.pycmodel.pklThis prevents unnecessary local files, virtual environments, and generated model files frombeing uploaded to GitHub.
