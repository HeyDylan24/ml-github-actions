Page 4 of 15predictions = model.predict(X_test)# Step 6: Calculate accuracyaccuracy = accuracy_score(y_test, predictions)return model, X_test, y_test, accuracyif __name__ == &quot;__main__&quot;:model, X_test, y_test, accuracy = train_model()# Save the trained modeljoblib.dump(model, &quot;model.pkl&quot;)print(&quot;Model training completed successfully.&quot;)print(f&quot;Test accuracy: {accuracy:.2%}&quot;)print(&quot;Model saved as model.pkl&quot;)What is a .pkl file?A .pkl file is a Pickle file in Python. It is used to save a Python object so that you can loadand reuse it later without creating it again from scratch.In your project, model.pkl stores the trained Random Forest Machine Learning model.Think of it this way: train.py — trains the model. model.pkl — stores the trained model. Later, you can load model.pkl and use it to make predictions on new data.Understand the codeFunction Purposeload_iris() Loads the flower datasettrain_test_split() Splits data into training and testing setsRandomForestClassifier() Creates the classification modelmodel.fit() Trains the modelmodel.predict() Predicts flower classesaccuracy_score() Calculates classification accuracyjoblib.dump() Saves the trained model
Page 5 of 157. Write automated test casesCreate test_model.py.These tests check whether the model trains successfully, produces valid predictions, andachieves a minimum test accuracy.from sklearn.datasets import load_irisfrom sklearn.metrics import accuracy_scorefrom train import train_modeldef test_model_trains_successfully():model, X_test, y_test, accuracy = train_model()assert model is not Noneassert accuracy &gt;= 0.80def test_predictions_have_correct_length():model, X_test, y_test, accuracy = train_model()predictions = model.predict(X_test)assert len(predictions) == len(y_test)def test_predictions_are_valid_classes():model, X_test, y_test, accuracy = train_model()predictions = model.predict(X_test)valid_classes = set(load_iris().target)assert set(predictions).issubset(valid_classes)def test_accuracy_is_valid():model, X_test, y_test, accuracy = train_model()predictions = model.predict(X_test)actual_accuracy = accuracy_score(y_test, predictions)assert 0.0 &lt;= actual_accuracy &lt;= 1.0assert actual_accuracy &gt;= 0.80These are basic functional tests. They do not guarantee that the model will generalize well tonew real-world data, but they are useful for demonstrating automated testing.
